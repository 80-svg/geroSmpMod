name: Auto Increment & Release Mod

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'gradle.properties' # Prevents infinite workflow loops when committing back

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment Patch Version in gradle.properties
        id: increment_version
        run: |
          # Read current version (e.g. mod_version=1.0.0)
          CURRENT_VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          echo "Current version: $CURRENT_VERSION"

          # Split into Major, Minor, Patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "New version: $NEW_VERSION"

          # Update gradle.properties. Nope
#          sed -i "s/mod_version=$CURRENT_VERSION/mod_version=$NEW_VERSION/g" gradle.properties

          # Set output and environment variables
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
#
#      - name: Commit Updated Version
#        run: |
#          git config user.name "github-actions[bot]"
#          git config user.email "github-actions[bot]@users.noreply.github.com"
#          git add gradle.properties
#          git commit -m "chore: bump mod version to ${{ env.NEW_VERSION }} [skip ci]"
#          git tag -a "v${{ env.NEW_VERSION }}" -m "Release v${{ env.NEW_VERSION }}"
#          git push origin master --tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Run Data Generation
        run: ./gradlew runDatagen

      - name: Build Mod Jar
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          name: "v${{ env.NEW_VERSION }}"
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
