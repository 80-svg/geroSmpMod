name: Release Mod

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'gradle.properties' # Prevents infinite workflow loops when committing back

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment Patch Version in gradle.properties
        id: increment_version
        run: |
          # Read current version (e.g. mod_version=1.0.0)
          CURRENT_VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          echo "Current version: $CURRENT_VERSION"

          # Split into Major, Minor, Patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          # Set output and environment variables
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Run Data Generation
        run: ./gradlew runDatagen

      - name: Build Mod Jar
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          name: "v${{ env.NEW_VERSION }}"
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
